/**:
  ros__parameters:
    debug: true
    target_frame: odom_vision
    detect_color: 0  #RED = 0,BLUE = 1,WHITE = 2,
    binary_thres: 70  #晚上70 白天50
    use_model_detector: true  # true: 使用模型推理检测装甲板, false: 使用传统视觉检测

    use_pca: true # 使用PCA算法矫正灯条的角点
    use_ba: true # 使用BA优化算法求解装甲板的Yaw角 

    model_detector.model_path: "package://armor_detector/model/0526.onnx"
    model_detector.confidence_threshold: 0.5
    model_detector.nms_threshold: 0.45


    # 传统检测参数 (仅在 use_model_detector: false 时生效)
    light.min_ratio: 0.0001
    light.max_ratio: 1.0
    light.max_angle: 40.0
    light.color_diff_thresh: 20
    armor.min_light_ratio: 0.8
    armor.min_small_center_distance: 0.8
    armor.max_small_center_distance: 3.5
    armor.min_large_center_distance: 3.5
    armor.max_large_center_distance: 8.0
    armor.max_angle: 35.0

    classifier_threshold: 0.7
    ignore_classes: ["negative"]